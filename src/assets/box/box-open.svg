<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#070707"/><stop offset=".5" stop-color="#2a2a2a"/><stop offset="1" stop-color="#070707"/></linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0d0d0d"/><stop offset=".5" stop-color="#363636"/><stop offset="1" stop-color="#0d0d0d"/></linearGradient>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0604"/><stop offset="1" stop-color="#2a1208"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0473a"/><stop offset=".55" stop-color="#b3221a"/><stop offset="1" stop-color="#7e130e"/></linearGradient>
    <linearGradient id="redH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7e130e"/><stop offset=".45" stop-color="#e0473a"/><stop offset="1" stop-color="#7e130e"/></linearGradient>
  </defs>
  <ellipse cx="200" cy="364" rx="170" ry="12" fill="#000" opacity=".35"/>
