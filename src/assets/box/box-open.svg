    <rect x="52" y="62" width="296" height="54" rx="4" fill="url(#lid)" stroke="#3c3c3c" stroke-width="6"/>
    <rect x="183" y="62" width="34" height="54" fill="url(#redH)" stroke="#4a0806" stroke-width="2"/>
  </g>
  <!-- the empty inside -->
  <path d="M62 174 L 90 138 L 310 138 L 338 174Z" fill="url(#inside)" stroke="#3c3c3c" stroke-width="5" stroke-linejoin="round"/>
  <rect x="62" y="172" width="276" height="186" rx="4" fill="url(#body)" stroke="#3c3c3c" stroke-width="6"/>
  <rect x="183" y="172" width="34" height="186" fill="url(#redH)" stroke="#4a0806" stroke-width="2"/>
